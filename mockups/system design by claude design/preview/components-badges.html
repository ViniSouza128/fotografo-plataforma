<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Badges, chips, eyebrow · preview</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-6); background: var(--ink-100); color: var(--ink-1000); font-family: var(--font-body); }

  .row { display: flex; gap: var(--space-2) var(--space-3); flex-wrap: wrap; align-items: center; margin-bottom: var(--space-4); }
  .tag {
    font-family: var(--font-mono); font-size: var(--text-xxs); letter-spacing: var(--tracking-widest);
    text-transform: uppercase; color: var(--ink-700); width: 110px; flex-shrink: 0;
  }

  /* Canonical .badge contract — mirrors components-atomic.html § 04. */
  .badge {
    display: inline-flex; align-items: center; gap: var(--space-1);
    padding: 3px var(--space-3); border-radius: var(--radius-pill);
    font-family: var(--font-mono); font-size: var(--text-xxs); font-weight: 500;
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .badge.b-success { background: var(--signal-dim);  color: var(--signal-400);  border-color: rgba(34,197,94,0.30); }
  .badge.b-warning { background: var(--warning-dim); color: var(--warning-500); border-color: rgba(232,163,58,0.30); }
  .badge.b-danger  { background: var(--danger-dim);  color: var(--danger-500);  border-color: rgba(224,85,79,0.30); }
  .badge.b-info    { background: var(--brand-dim);   color: var(--brand-400);   border-color: rgba(31,122,224,0.30); }
  .badge.b-neutral { background: var(--ink-200);     color: var(--ink-900);     border-color: var(--ink-500); }

  /* Canonical .chip contract — mirrors components-atomic.html § 05. */
  .chip {
    display: inline-flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) var(--space-3); border: 1px solid var(--ink-500); border-radius: var(--radius);
    background: transparent; color: var(--ink-900);
    font-family: var(--font-body); font-size: var(--text-xs); font-weight: 500; letter-spacing: var(--tracking-snug);
    cursor: pointer; white-space: nowrap;
    transition: background var(--duration-quick) var(--ease-out), border-color var(--duration-quick) var(--ease-out), color var(--duration-quick) var(--ease-out);
  }
  .chip:hover { border-color: var(--ink-700); color: var(--ink-1000); }
  .chip.is-active { background: var(--brand-500); border-color: var(--brand-500); color: var(--ink-1000); }

  .chip-eyebrow {
    display: inline-flex; align-items: center; gap: var(--space-2);
    color: var(--brand-400); font-family: var(--font-body); font-size: var(--text-xs); font-weight: 500;
    letter-spacing: var(--tracking-widest); text-transform: uppercase;
  }
  .chip-eyebrow::before, .chip-eyebrow::after { content: ""; display: block; width: 18px; height: 1px; background: currentColor; opacity: 0.45; }
</style>
</head>
<body>
  <div class="row"><span class="tag">Status</span>
    <span class="badge b-info"><span class="dot"></span>Aguardando pagto</span>
    <span class="badge b-success"><span class="dot"></span>Pago</span>
    <span class="badge b-warning"><span class="dot"></span>Pendente</span>
    <span class="badge b-danger"><span class="dot"></span>Cancelado</span>
    <span class="badge b-neutral">Rascunho</span>
  </div>
  <div class="row"><span class="tag">Filter chips</span>
    <button type="button" class="chip is-active">Todos</button>
    <button type="button" class="chip">Público</button>
    <button type="button" class="chip">Não listado</button>
    <button type="button" class="chip">Privado</button>
    <button type="button" class="chip">Corrida</button>
    <button type="button" class="chip">Rodeio</button>
  </div>
  <div class="row"><span class="tag">Eyebrow</span>
    <span class="chip-eyebrow">Fotografia Profissional</span>
  </div>
</body>
</html>
