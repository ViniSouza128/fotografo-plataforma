<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Loading · spinner · skeleton · progress</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-6); background: var(--ink-100); color: var(--ink-1000); font-family: var(--font-body); }
  .row { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; margin-bottom: var(--space-5); }
  .tag { font-family: var(--font-mono); font-size: var(--text-xxs); letter-spacing: var(--tracking-widest); text-transform: uppercase; color: var(--ink-700); width: 110px; flex-shrink: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--ink-500); border-top-color: var(--brand-500); border-radius: 50%; animation: spin 0.7s linear infinite; }
  .spinner.is-sm { width: 14px; height: 14px; }
  .spinner.is-lg { width: 32px; height: 32px; border-width: 3px; }

  @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skeleton { display: block; background: linear-gradient(90deg, var(--ink-300) 0%, var(--ink-400) 50%, var(--ink-300) 100%); background-size: 200% 100%; border-radius: var(--radius-sm); animation: skel 1.6s ease-in-out infinite; }
  .skeleton.is-text   { height: 12px; width: 100%; border-radius: 6px; }
  .skeleton.is-text.is-short  { width: 40%; }
  .skeleton.is-text.is-medium { width: 70%; }
  .skeleton.is-block  { width: 100%; aspect-ratio: 4 / 3; border-radius: var(--radius); }
  .skeleton.is-square { width: 64px; height: 64px; border-radius: var(--radius); }
  .skeleton.is-circle { width: 40px; height: 40px; border-radius: 50%; }

  .progress { display: block; width: 100%; height: 6px; background: var(--ink-400); border-radius: var(--radius-pill); overflow: hidden; }
  .progress > span { display: block; height: 100%; background: var(--brand-500); }
  .progress.is-success > span { background: var(--signal-500); }
  .progress.is-warning > span { background: var(--warning-500); }
  .progress.is-danger > span  { background: var(--danger-500); }
  @keyframes indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
  .progress.is-indeterminate > span { width: 30% !important; animation: indet 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite; }

  @media (prefers-reduced-motion: reduce) {
    .spinner,
    .skeleton,
    .progress.is-indeterminate > span { animation: none !important; }
  }

  .skel-card { width: 240px; padding: var(--space-4); background: var(--ink-300); border:1px solid var(--ink-500); border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: var(--space-3); }

  .upload-progress { display: grid; grid-template-columns: 1fr max-content; gap: var(--space-2) var(--space-4); align-items: center; padding: var(--space-3) var(--space-4); background: var(--ink-200); border: 1px solid var(--ink-500); border-radius: var(--radius); max-width: 420px; margin-bottom: var(--space-2); }
  .upload-progress .name { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--ink-900); }
  .upload-progress .pct  { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--ink-1000); }
  .upload-progress .progress { grid-column: 1 / -1; }
</style></head>
<body>
  <div class="row"><span class="tag">Spinner</span>
    <span class="spinner is-sm"></span>
    <span class="spinner"></span>
    <span class="spinner is-lg"></span>
    <span style="color: var(--ink-800); font-family: var(--font-mono); font-size: var(--text-xs); margin-left: var(--space-4);">14 · 20 · 32 px</span>
  </div>
  <div class="row"><span class="tag">Skeleton texto</span>
    <div style="display:flex; flex-direction:column; gap: var(--space-2); flex:1; max-width: 360px;">
      <span class="skeleton is-text is-medium"></span>
      <span class="skeleton is-text"></span>
      <span class="skeleton is-text is-short"></span>
    </div>
  </div>
  <div class="row"><span class="tag">Skeleton formas</span>
    <span class="skeleton is-circle"></span>
    <span class="skeleton is-square"></span>
    <span class="skeleton is-block" style="max-width: 240px;"></span>
  </div>
  <div class="row"><span class="tag">Skeleton card</span>
    <div class="skel-card">
      <span class="skeleton is-block" style="aspect-ratio: 16/10;"></span>
      <span class="skeleton is-text is-medium"></span>
      <span class="skeleton is-text is-short"></span>
    </div>
  </div>
  <div class="row"><span class="tag">Progress det.</span>
    <div style="flex:1; max-width: 380px; display:flex; flex-direction:column; gap: var(--space-2);">
      <div class="progress"><span style="width: 32%;"></span></div>
      <div class="progress"><span style="width: 68%;"></span></div>
      <div class="progress"><span style="width: 100%;"></span></div>
    </div>
  </div>
  <div class="row"><span class="tag">Semânticas</span>
    <div style="flex:1; max-width: 380px; display:flex; flex-direction:column; gap: var(--space-2);">
      <div class="progress is-success"><span style="width: 100%;"></span></div>
      <div class="progress is-warning"><span style="width: 62%;"></span></div>
      <div class="progress is-danger"><span style="width: 23%;"></span></div>
    </div>
  </div>
  <div class="row"><span class="tag">Indeterminada</span>
    <div style="flex:1; max-width: 380px;"><div class="progress is-indeterminate"><span></span></div></div>
  </div>
  <div class="row"><span class="tag">Upload-progress</span></div>
  <div class="upload-progress">
    <span class="name">DSC_3812.NEF</span>
    <span class="pct">62%</span>
    <div class="progress"><span style="width: 62%;"></span></div>
  </div>
  <div class="upload-progress">
    <span class="name">DSC_3813.NEF</span>
    <span class="pct">100%</span>
    <div class="progress is-success"><span style="width: 100%;"></span></div>
  </div>
  <div class="upload-progress">
    <span class="name">DSC_3814.NEF · falhou</span>
    <span class="pct" style="color: var(--danger-500);">erro</span>
    <div class="progress is-danger"><span style="width: 47%;"></span></div>
  </div>
</body></html>
