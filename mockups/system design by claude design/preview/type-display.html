<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Display type · preview</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-8); background: var(--ink-100); color: var(--ink-1000); font-family: var(--font-body); }

  .row {
    display: flex; align-items: baseline; gap: var(--space-4);
    border-bottom: 1px solid var(--ink-300); padding: var(--space-4) 0;
  }
  .row:last-child { border-bottom: none; }
  .label {
    flex: 0 0 140px;
    font-family: var(--font-mono); font-size: var(--text-xxs); color: var(--ink-700); letter-spacing: var(--tracking-wide);
  }
  .sample { font-family: var(--font-heading); color: var(--ink-1000); }
  .sample.is-display { font-family: var(--font-display); font-style: italic; }
</style>
</head>
<body>
  <div class="row">
    <div class="label">5xl · clamp 48–88</div>
    <div class="sample" style="font-size: var(--text-5xl); font-weight: 300; letter-spacing: var(--tracking-tight); line-height: var(--leading-tight);">Eventos</div>
  </div>
  <div class="row">
    <div class="label">4xl · 56 · 300</div>
    <div class="sample" style="font-size: var(--text-4xl); font-weight: 300; letter-spacing: var(--tracking-tight); line-height: var(--leading-tight);">Abertura da Safra</div>
  </div>
  <div class="row">
    <div class="label">3xl · 40 · 400</div>
    <div class="sample" style="font-size: var(--text-3xl); font-weight: 400; letter-spacing: var(--tracking-snug);">Seus downloads</div>
  </div>
  <div class="row">
    <div class="label">2xl · 30 · 500</div>
    <div class="sample" style="font-size: var(--text-2xl); font-weight: 500;">Galeria do evento</div>
  </div>
  <div class="row">
    <div class="label">display · italic</div>
    <div class="sample is-display" style="font-size: var(--text-4xl); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight);">As fotos são o design.</div>
  </div>
</body>
</html>
