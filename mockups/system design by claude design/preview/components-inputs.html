<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Inputs · preview</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-6); background: var(--ink-100); color: var(--ink-1000); font-family: var(--font-body); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); }

  /* Canonical .field / .input contract — mirrors components-atomic.html § 02 · Inputs. */
  .field { display: flex; flex-direction: column; gap: var(--space-2); }
  .field-label {
    font-family: var(--font-body); font-size: var(--text-xs); font-weight: 500;
    letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--ink-800);
  }
  .field-helper { font-family: var(--font-body); font-size: var(--text-xs); color: var(--ink-700); letter-spacing: var(--tracking-snug); }
  .field-error-msg {
    font-family: var(--font-body); font-size: var(--text-xs); color: var(--danger-500);
    letter-spacing: var(--tracking-snug); display: flex; align-items: center; gap: var(--space-1);
  }

  .input {
    background: var(--ink-400); color: var(--ink-1000);
    font-family: var(--font-body); font-size: var(--text-sm); font-weight: 300;
    padding: var(--space-3) var(--space-4); border: 1px solid var(--ink-500); border-radius: var(--radius);
    outline: none; width: 100%; box-sizing: border-box;
    transition: border-color var(--duration-quick) var(--ease-out), background var(--duration-quick) var(--ease-out), box-shadow var(--duration-quick) var(--ease-out);
  }
  .input::placeholder { color: var(--ink-700); }
  .input:hover:not(:disabled):not(:focus) { border-color: var(--ink-700); }
  .input:focus-visible, .input.is-focus { border-color: var(--brand-500); box-shadow: var(--focus-ring); background: var(--ink-300); }

  .field.is-error .field-label { color: var(--danger-500); }
  .field.is-error .input { border-color: var(--danger-500); background: rgba(224, 85, 79, 0.05); }

  .input-affix { position: relative; display: flex; align-items: stretch; }
  .input-affix .ico { position: absolute; top: 50%; left: var(--space-3); transform: translateY(-50%); color: var(--ink-700); pointer-events: none; flex-shrink: 0; width: 16px; height: 16px; }
  .input-affix .input.has-leading { padding-left: var(--space-10); }
</style>
</head>
<body>
  <div class="grid">
    <div class="field">
      <label class="field-label" for="i-default">Default</label>
      <input id="i-default" class="input" type="text" placeholder="Seu nome completo">
    </div>

    <div class="field">
      <label class="field-label" for="i-search">Com ícone</label>
      <div class="input-affix">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="i-search" class="input has-leading" type="search" placeholder="Buscar álbum, mês, ano…">
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="i-focus">Focus</label>
      <input id="i-focus" class="input is-focus" type="email" value="viniciusrsouza@gmail.com">
    </div>

    <div class="field is-error">
      <label class="field-label" for="i-err">Error</label>
      <input id="i-err" class="input" type="text" value="123.456.789-00" aria-invalid="true">
      <span class="field-error-msg">CPF inválido — verifique os dígitos.</span>
    </div>
  </div>
</body>
</html>
